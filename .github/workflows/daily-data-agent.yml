name: Daily Data Agent

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-report:
    runs-on: ubuntu-latest
    env:
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN || secrets.discord_bot_token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check Discord token presence
        run: |
          if [[ -n "${DISCORD_BOT_TOKEN}" ]]; then
            echo "Discord token detected."
          else
            echo "Discord token missing. Discord source will be skipped."
          fi

      - name: Generate daily report
        run: node .github/scripts/generate-daily-report.mjs

      - name: Commit report updates
        run: |
          if [[ -n "$(git status --porcelain src/daily-report.html src/data/daily-report-latest.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/daily-report.html src/data/daily-report-latest.json
            git commit -m "chore: update daily data report"
            git push
          else
            echo "No report changes to commit."
          fi